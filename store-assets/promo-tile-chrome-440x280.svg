<svg width="440" height="280" viewBox="0 0 440 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="440" height="280" fill="#ffffff"/>

  <!-- Subtle top accent gradient -->
  <rect width="440" height="120" fill="url(#accentFade)"/>

  <!-- Fine grid -->
  <g stroke="#1e40af" stroke-width="0.4" opacity="0.05">
    <line x1="0" y1="56" x2="440" y2="56"/>
    <line x1="0" y1="112" x2="440" y2="112"/>
    <line x1="0" y1="168" x2="440" y2="168"/>
    <line x1="0" y1="224" x2="440" y2="224"/>
    <line x1="88" y1="0" x2="88" y2="280"/>
    <line x1="176" y1="0" x2="176" y2="280"/>
    <line x1="264" y1="0" x2="264" y2="280"/>
    <line x1="352" y1="0" x2="352" y2="280"/>
  </g>

  <!-- Logo mark (centered) -->
  <g transform="translate(191, 14) scale(0.29)">
    <g stroke="#1e40af" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="10" y1="10" x2="190" y2="140"/>
      <line x1="190" y1="10" x2="10" y2="140"/>
    </g>
    <circle fill="#1e40af" cx="100" cy="75" r="28"/>
    <g stroke="white" stroke-width="3" stroke-linecap="round">
      <line x1="89" y1="68" x2="111" y2="68"/>
      <line x1="89" y1="75" x2="111" y2="75"/>
      <line x1="89" y1="82" x2="111" y2="82"/>
    </g>
  </g>

  <!-- Product name -->
  <text x="220" y="78" text-anchor="middle"
        font-family="'Geist Mono', 'SF Mono', 'Consolas', monospace"
        font-size="20" font-weight="700" letter-spacing="0.06em"
        fill="#0f172a">
    <tspan>Fill</tspan><tspan font-weight="800">Kit</tspan>
  </text>

  <!-- Tagline -->
  <text x="220" y="93" text-anchor="middle"
        font-family="'Geist', -apple-system, sans-serif"
        font-size="8" fill="#64748b" letter-spacing="0.02em">
    Realistic form autofill for developers
  </text>

  <!-- Divider -->
  <line x1="195" y1="102" x2="245" y2="102" stroke="#1e40af" stroke-width="1" opacity="0.2"/>

  <!-- Trust badges (row 1: three badges) -->
  <g font-family="'Geist Mono', 'SF Mono', monospace" font-size="6" letter-spacing="0.05em">
    <g transform="translate(50, 112)">
      <!-- Open Source -->
      <rect x="0" y="0" width="105" height="22" fill="#f0f4ff" stroke="#dbe4f8" stroke-width="0.5"/>
      <rect x="0" y="0" width="2" height="22" fill="#1e40af"/>
      <text x="10" y="10" font-weight="700" fill="#1e40af">OPEN SOURCE</text>
      <text x="10" y="18" font-size="5" font-weight="400" fill="#64748b" font-family="'Geist', sans-serif">Inspect every line of code</text>

      <!-- 100% Local -->
      <rect x="115" y="0" width="105" height="22" fill="#f0f4ff" stroke="#dbe4f8" stroke-width="0.5"/>
      <rect x="115" y="0" width="2" height="22" fill="#1e40af"/>
      <text x="125" y="10" font-weight="700" fill="#1e40af">100% LOCAL</text>
      <text x="125" y="18" font-size="5" font-weight="400" fill="#64748b" font-family="'Geist', sans-serif">No data leaves your browser</text>

      <!-- No Tracking -->
      <rect x="230" y="0" width="105" height="22" fill="#f0f4ff" stroke="#dbe4f8" stroke-width="0.5"/>
      <rect x="230" y="0" width="2" height="22" fill="#1e40af"/>
      <text x="240" y="10" font-weight="700" fill="#1e40af">NO TRACKING</text>
      <text x="240" y="18" font-size="5" font-weight="400" fill="#64748b" font-family="'Geist', sans-serif">Zero analytics or telemetry</text>
    </g>

    <!-- Trust badges (row 2: cloud AI + fields + locales) -->
    <g transform="translate(50, 142)">
      <!-- Opt-in Cloud AI -->
      <rect x="0" y="0" width="155" height="22" fill="#fefce8" stroke="#fde68a" stroke-width="0.5"/>
      <rect x="0" y="0" width="2" height="22" fill="#d97706"/>
      <text x="10" y="10" font-weight="700" fill="#92400e">OPT-IN CLOUD AI</text>
      <text x="10" y="18" font-size="5" font-weight="400" fill="#92400e" opacity="0.7"
            font-family="'Geist', sans-serif">Smart field detection &amp; contextual data</text>

      <!-- 150+ Fields -->
      <rect x="165" y="0" width="82" height="22" fill="#f0f4ff" stroke="#dbe4f8" stroke-width="0.5"/>
      <rect x="165" y="0" width="2" height="22" fill="#1e40af"/>
      <text x="175" y="10" font-weight="700" fill="#1e40af">150+ FIELDS</text>
      <text x="175" y="18" font-size="5" font-weight="400" fill="#64748b" font-family="'Geist', sans-serif">Every input type covered</text>

      <!-- 50+ Locales -->
      <rect x="257" y="0" width="78" height="22" fill="#f0f4ff" stroke="#dbe4f8" stroke-width="0.5"/>
      <rect x="257" y="0" width="2" height="22" fill="#1e40af"/>
      <text x="267" y="10" font-weight="700" fill="#1e40af">50+ LOCALES</text>
      <text x="267" y="18" font-size="5" font-weight="400" fill="#64748b" font-family="'Geist', sans-serif">Locale-matched data</text>
    </g>
  </g>

  <!-- Feature summary -->
  <text x="220" y="192" text-anchor="middle"
        font-family="'Geist Mono', monospace"
        font-size="5" fill="#94a3b8" letter-spacing="0.08em">
    VALID &amp; INVALID MODES  ·  CONTEXT-AWARE  ·  NAMES · EMAILS · ADDRESSES · CARDS · AND MORE
  </text>

  <!-- CTA tagline -->
  <text x="220" y="212" text-anchor="middle"
        font-family="'Geist', -apple-system, sans-serif"
        font-size="8" fill="#0f172a" font-weight="500">
    Stop typing fake data. Start filling forms in one click.
  </text>

  <!-- URL -->
  <text x="220" y="248" text-anchor="middle"
        font-family="'Geist Mono', monospace"
        font-size="7" fill="#1e40af" letter-spacing="0.04em" font-weight="600">
    fillkit.dev
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="274" width="440" height="6" fill="#1e40af"/>
</svg>
