<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accentFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- White background -->
  <rect width="1280" height="800" fill="#ffffff"/>

  <!-- Subtle top accent gradient -->
  <rect width="1280" height="350" fill="url(#accentFade)"/>

  <!-- Fine grid -->
  <g stroke="#1e40af" stroke-width="0.4" opacity="0.05">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="640" x2="1280" y2="640"/>
    <line x1="256" y1="0" x2="256" y2="800"/>
    <line x1="512" y1="0" x2="512" y2="800"/>
    <line x1="768" y1="0" x2="768" y2="800"/>
    <line x1="1024" y1="0" x2="1024" y2="800"/>
  </g>

  <!-- Logo mark (centered) -->
  <g transform="translate(556, 80) scale(0.84)">
    <g stroke="#1e40af" stroke-width="10" stroke-linecap="round" fill="none">
      <line x1="10" y1="10" x2="190" y2="140"/>
      <line x1="190" y1="10" x2="10" y2="140"/>
    </g>
    <circle fill="#1e40af" cx="100" cy="75" r="28"/>
    <g stroke="white" stroke-width="3" stroke-linecap="round">
      <line x1="89" y1="68" x2="111" y2="68"/>
      <line x1="89" y1="75" x2="111" y2="75"/>
      <line x1="89" y1="82" x2="111" y2="82"/>
    </g>
  </g>

  <!-- Product name -->
  <text x="640" y="280" text-anchor="middle"
        font-family="'Geist Mono', 'SF Mono', 'Consolas', monospace"
        font-size="56" font-weight="700" letter-spacing="0.06em"
        fill="#0f172a">
    <tspan>Fill</tspan><tspan font-weight="800">Kit</tspan>
  </text>

  <!-- Tagline -->
  <text x="640" y="320" text-anchor="middle"
        font-family="'Geist', -apple-system, sans-serif"
        font-size="20" fill="#64748b" letter-spacing="0.02em">
    Realistic form autofill for developers
  </text>

  <!-- Divider -->
  <line x1="560" y1="350" x2="720" y2="350" stroke="#1e40af" stroke-width="2" opacity="0.2"/>

  <!-- Trust badges (row 1: three badges) -->
  <g font-family="'Geist Mono', 'SF Mono', monospace" font-size="14" letter-spacing="0.05em">
    <g transform="translate(264, 385)">
      <!-- Open Source -->
      <rect x="0" y="0" width="220" height="48" fill="#f0f4ff" stroke="#dbe4f8" stroke-width="0.5"/>
      <rect x="0" y="0" width="4" height="48" fill="#1e40af"/>
      <text x="22" y="24" font-weight="700" fill="#1e40af">OPEN SOURCE</text>
      <text x="22" y="40" font-size="11" font-weight="400" fill="#64748b" font-family="'Geist', sans-serif">Inspect every line of code</text>

      <!-- 100% Local -->
      <rect x="240" y="0" width="220" height="48" fill="#f0f4ff" stroke="#dbe4f8" stroke-width="0.5"/>
      <rect x="240" y="0" width="4" height="48" fill="#1e40af"/>
      <text x="262" y="24" font-weight="700" fill="#1e40af">100% LOCAL</text>
      <text x="262" y="40" font-size="11" font-weight="400" fill="#64748b" font-family="'Geist', sans-serif">No data leaves your browser</text>

      <!-- No Tracking -->
      <rect x="480" y="0" width="220" height="48" fill="#f0f4ff" stroke="#dbe4f8" stroke-width="0.5"/>
      <rect x="480" y="0" width="4" height="48" fill="#1e40af"/>
      <text x="502" y="24" font-weight="700" fill="#1e40af">NO TRACKING</text>
      <text x="502" y="40" font-size="11" font-weight="400" fill="#64748b" font-family="'Geist', sans-serif">Zero analytics or telemetry</text>
    </g>

    <!-- Trust badges (row 2: cloud AI + fields + locales) -->
    <g transform="translate(264, 453)">
      <!-- Opt-in Cloud AI -->
      <rect x="0" y="0" width="340" height="48" fill="#fefce8" stroke="#fde68a" stroke-width="0.5"/>
      <rect x="0" y="0" width="4" height="48" fill="#d97706"/>
      <text x="22" y="24" font-weight="700" fill="#92400e">OPT-IN CLOUD AI</text>
      <text x="22" y="40" font-size="11" font-weight="400" fill="#92400e" opacity="0.7"
            font-family="'Geist', sans-serif">Smart field detection &amp; contextual data generation</text>

      <!-- 150+ Fields + 50+ Locales -->
      <rect x="360" y="0" width="170" height="48" fill="#f0f4ff" stroke="#dbe4f8" stroke-width="0.5"/>
      <rect x="360" y="0" width="4" height="48" fill="#1e40af"/>
      <text x="382" y="24" font-weight="700" fill="#1e40af">150+ FIELDS</text>
      <text x="382" y="40" font-size="11" font-weight="400" fill="#64748b" font-family="'Geist', sans-serif">Every input type covered</text>

      <rect x="550" y="0" width="170" height="48" fill="#f0f4ff" stroke="#dbe4f8" stroke-width="0.5"/>
      <rect x="550" y="0" width="4" height="48" fill="#1e40af"/>
      <text x="572" y="24" font-weight="700" fill="#1e40af">50+ LOCALES</text>
      <text x="572" y="40" font-size="11" font-weight="400" fill="#64748b" font-family="'Geist', sans-serif">Locale-matched realistic data</text>
    </g>
  </g>

  <!-- Feature summary -->
  <text x="640" y="570" text-anchor="middle"
        font-family="'Geist Mono', monospace"
        font-size="13" fill="#94a3b8" letter-spacing="0.08em">
    VALID &amp; INVALID MODES  ·  CONTEXT-AWARE  ·  NAMES · EMAILS · ADDRESSES · CARDS · AND MORE
  </text>

  <!-- CTA tagline -->
  <text x="640" y="620" text-anchor="middle"
        font-family="'Geist', -apple-system, sans-serif"
        font-size="16" fill="#0f172a" font-weight="500">
    Stop typing fake data. Start filling forms in one click.
  </text>

  <!-- URL -->
  <text x="640" y="720" text-anchor="middle"
        font-family="'Geist Mono', monospace"
        font-size="14" fill="#1e40af" letter-spacing="0.04em" font-weight="600">
    fillkit.dev
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="790" width="1280" height="10" fill="#1e40af"/>
</svg>
