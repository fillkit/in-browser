<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FillKit</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-container">
      <!-- Header -->
      <header class="header">
        <div class="logo">
          <img src="../assets/logo.svg" alt="FillKit" width="40" height="40" />
        </div>
        <div class="header-info">
          <h1>FILLKIT</h1>
          <div class="status" id="status">
            <span class="status-dot"></span>
            <span class="status-text">Loading...</span>
          </div>
        </div>
      </header>

      <!-- Toggle -->
      <div class="toggle-section">
        <label class="toggle-row" for="enableToggle">
          <span class="toggle-label">Enable FillKit</span>
          <div class="toggle-switch">
            <input type="checkbox" id="enableToggle" checked />
            <span class="toggle-slider"></span>
          </div>
        </label>
      </div>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Quick Seed -->
      <div class="seed-section">
        <label class="seed-row" for="seedInput">
          <span class="seed-label">Seed</span>
          <input
            type="number"
            id="seedInput"
            class="seed-input"
            placeholder="Random"
            min="0"
            step="1"
          />
        </label>
      </div>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Settings Link -->
      <div class="links">
        <a href="#" class="link" id="settingsLink">
          <svg
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
            ></path>
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            ></path>
          </svg>
          <span>Settings</span>
        </a>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <span id="versionText">v1.0.0</span>
      </footer>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
